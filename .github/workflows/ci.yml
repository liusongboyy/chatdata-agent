name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 单元测试不连库；*RealDbTest 在有库时才跑（Assumptions 跳过），
      # 所以这里不起 MySQL —— 那些真库测试留给本地
      - name: Run tests
        run: mvn -B test

      - name: Upload surefire reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/**'
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Package
        run: mvn -B -DskipTests package

      # 打包能过不代表能启动。这里只验证 jar 结构，完整启动依赖数据库
      - name: Verify jars
        run: |
          set -e
          for m in iam ask gateway; do
            jar=$(ls chatdata-agent-$m/target/chatdata-agent-$m-*-SNAPSHOT.jar)
            echo "checking $jar"
            unzip -l "$jar" | grep -q 'BOOT-INF/' || { echo "$jar 不是可执行的 fat jar"; exit 1; }
          done
