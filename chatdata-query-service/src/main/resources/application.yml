server:
  # 8080 归网关（唯一入口）。ask 只在内网被网关代理，不直接对外。
  port: ${ASK_PORT:8081}

spring:
  application:
    name: chatdata-query-service
  # 保留你加的这一行：默认以 dev 启动，省去每次敲 -Dspring-boot.run.profiles=dev
  profiles:
    active: dev

  # 业务库：角色表、审计表、问数引擎的 ask_* 表
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:chatdata_ask}?characterEncoding=UTF-8&useUnicode=true&useSSL=false&tinyInt1isBit=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

chatdata:
  # IAM：ask 不再自己签发令牌，只校验 IAM 发的（不透明令牌 + 内省）
  iam:
    base-url: ${IAM_ISSUER:http://127.0.0.1:9000}
    # 内省结果缓存秒数。角色变更的生效延迟上限就是它
    introspect-cache-seconds: ${IAM_INTROSPECT_CACHE_SECONDS:30}
    # 读角色/用户目录用的服务身份（client_credentials）
    client-id: ask-resource-server
    client-secret: ${IAM_RESOURCE_SECRET:}

  # 自研问数引擎（ADR-0006）
  engine:
    # 启动时校验 ask_* 里的语义配置。默认拒绝启动——见 EngineStartupProperties 的说明。
    # 配置在库里，用 SQL 就能改，所以不存在"起不来就改不了"的死锁。
    startup:
      enabled: true
      fail-on-violation: true
    model:
      # 与厂商那套无关：本引擎的模型配置完全独立（见 ADR-0006）。
      base-url: ${LLM_BASE_URL:https://ark.cn-beijing.volces.com/api/coding/v3}
      api-key: ${LLM_API_KEY:}
      model-name: ${LLM_MODEL:deepseek-v4-1-flash-261017}
      temperature: 0
      max-tokens: 16384
    datasource:
      # 数据源密码的加密密钥。**必填，无默认值**——共用默认密钥等于任何人都能解密。
      # 通过环境变量 CHATDATA_ENGINE_DS_SECRET 提供。
      secret: ${CHATDATA_ENGINE_DS_SECRET:}
    # 多轮追问的会话状态。关掉它 = 每次提问都是独立会话（FR-5.2 失效）。
    session:
      enabled: true
      # 留空 = 用数据源当前连的库（即上面 MYSQL_DB 指定的那个），不重复配一遍
      database:
      table: ask_agent_session
      # 开发便利项。生产建议置 false 并执行 sql/12-ask-agent-session.sql——
      # 自动建表要求 CREATE 权限，多数生产账号没有
      create-table: true
      # 单会话保留的最近消息条数。不设上限会让单轮 token 成本单调上升，
      # 并在某一轮突然超出模型窗口（那时失败的原因与用户问什么无关）
      max-messages: 40
      # OVERWRITE | FAIL | APPEND_MERGE，取舍见 AskSessionProperties
      conflict-policy: OVERWRITE

logging:
  level:
    root: INFO
    com.liusongboyy.chatdata: INFO

# 健康检查。只暴露 health：metrics / env / heapdump 走公网入口是信息泄露面。
# show-details=never 让响应里不带数据库、Redis 等组件的明细——
# 探针只需要知道 200 还是 503。
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
