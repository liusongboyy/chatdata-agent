server:
  port: ${IAM_PORT:9000}
  servlet:
    session:
      cookie:
        # Cookie 不区分端口，IAM 与网关同主机时必须用不同的名字，
        # 否则两边的会话 Cookie 会互相覆盖（表现为"登录成功但下一个请求又未登录"）
        name: IAM_SESSION

spring:
  application:
    name: chatdata-identity-service

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${IAM_DB:chatdata_iam}?characterEncoding=UTF-8&useUnicode=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s

  thymeleaf:
    cache: false

iam:
  tenant: ${IAM_TENANT:t_default}
  # 必须与浏览器/客户端实际访问 IAM 的地址一致；生产用 https 域名
  issuer: ${IAM_ISSUER:http://127.0.0.1:9000}
  clients:
    bff-id: chatdata-web-bff
    bff-secret: ${IAM_BFF_SECRET:}
    bff-redirect-uri: ${IAM_BFF_REDIRECT_URI:http://127.0.0.1:8080/bff/callback}
    resource-id: ask-resource-server
    resource-secret: ${IAM_RESOURCE_SECRET:}

logging:
  level:
    root: INFO
    com.liusongboyy.chatdata: INFO
    org.springframework.security: INFO

# 健康检查。只暴露 health：metrics / env / heapdump 走公网入口是信息泄露面。
# show-details=never 让响应里不带数据库、Redis 等组件的明细——
# 探针只需要知道 200 还是 503。
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
