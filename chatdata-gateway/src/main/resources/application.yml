server:
  port: ${GATEWAY_PORT:8080}

spring:
  application:
    name: chatdata-gateway

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  session:
    # BFF 会话落 Redis（多实例必须共享）。Cookie 名用默认 SESSION；
    # IAM 那边已改成 IAM_SESSION——Cookie 不区分端口，同名会互相覆盖。
    timeout: 30m

  security:
    oauth2:
      client:
        registration:
          iam:
            client-id: chatdata-web-bff
            client-secret: ${IAM_BFF_SECRET:}
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            # 回调落在网关自己身上（BFF）：令牌只留在网关，浏览器拿不到
            redirect-uri: '{baseUrl}/bff/callback'
            scope: ask.read,ask.feedback
        provider:
          iam:
            # 不用 issuer-uri：IAM 没开 OIDC，没有 discovery 文档
            authorization-uri: ${IAM_ISSUER:http://127.0.0.1:9000}/oauth2/authorize
            token-uri: ${IAM_ISSUER:http://127.0.0.1:9000}/oauth2/token
            # 不透明令牌没有 claim，主体信息靠 IAM 的"富内省"端点取
            user-info-uri: ${IAM_ISSUER:http://127.0.0.1:9000}/iam/principal
            user-name-attribute: username

  cloud:
    gateway:
      server:
        webflux:
          # 路由只做转发与令牌中继，不做业务判断
          routes:
            # 账号中心：IAM 的接口、授权服务器端点、验证码、以及它的 SPA（/iam/app/**）
            - id: iam
              uri: ${IAM_URI:http://127.0.0.1:9000}
              predicates:
                - Path=/iam/**,/oauth2/**,/.well-known/**,/login,/captcha/**
            # 问数服务：SPA 与业务接口。
            # TokenRelay 把 BFF 会话里的 access token 注入 Authorization 头，
            # ask 作为资源服务器内省校验它。
            # /sys/** 已随 ask 的本地认证一起删除，不再路由。
            - id: ask
              uri: ${ASK_URI:http://127.0.0.1:8081}
              predicates:
                - Path=/app/**,/api/ask/**,/api/engine/**
              filters:
                - TokenRelay=

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

logging:
  level:
    root: INFO
    com.liusongboyy.chatdata: INFO
    org.springframework.cloud.gateway: INFO
